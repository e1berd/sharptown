services:
  rest:
    build:
      context: .
      dockerfile: packages/server-rest/Dockerfile
    image: sharptown-rest
    ports:
      - "${SHARPTOWN_PORT:-3001}:3001"
    environment:
      SHARPTOWN_PORT: 3001
      SHARPTOWN_HOST: 0.0.0.0
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  grpc:
    build:
      context: .
      dockerfile: packages/server-grpc/Dockerfile
    image: sharptown-grpc
    ports:
      - "${SHARPTOWN_GRPC_PORT:-50051}:50051"
    environment:
      SHARPTOWN_GRPC_PORT: 50051
      SHARPTOWN_GRPC_HOST: 0.0.0.0
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  jsonrpc:
    build:
      context: .
      dockerfile: packages/server-jsonrpc/Dockerfile
    image: sharptown-jsonrpc
    ports:
      - "${SHARPTOWN_JSONRPC_PORT:-3002}:3002"
    environment:
      SHARPTOWN_JSONRPC_PORT: 3002
      SHARPTOWN_JSONRPC_HOST: 0.0.0.0
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
