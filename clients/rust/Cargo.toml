[package]
name = "sharptown-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client for the Sharptown image transformation API"
publish = false

[lib]
name = "sharptown"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
