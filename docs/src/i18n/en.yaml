home:
  meta_description: Sharptown — self-hosted image transformation service built on Fastify and Sharp.
  tag: Image transformation engine
  title_before: 'Self-hosted '
  title_highlight: image transformation
  title_after: .
  lead_html: >-
    Resize, convert and optimize images over REST, gRPC or JSON-RPC. A framework-agnostic
    core built on <code>Sharp</code>, a Fastify plugin, and an isomorphic JS client — run it
    yourself, in front of your own image delivery.
  cta_docs: Read the docs →
  cta_playground: Open playground
  band:
    - { strong: 'WebP · AVIF · PNG · JPEG · GIF · HEIF', label: output formats }
    - { strong: '0 bytes buffered', label: gRPC streaming }
    - { strong: 'Browser · Node · Bun · Deno', label: isomorphic client }
    - { strong: '1 register()', label: Fastify plugin }
  features_heading: Capabilities
  features:
    - mark: ⤓
      title: Optimize delivery
      body: Convert uploaded images to WebP, AVIF, PNG, JPEG, GIF or HEIF on the fly. Smaller files mean less bandwidth and faster page loads.
    - mark: ⟳
      title: Transform on demand
      body: Resize, rotate, flip, blur, grayscale, tint and alpha control — composed in a single request, powered by libvips via Sharp.
    - mark: ◫
      title: Three transports
      body: REST, gRPC bidirectional streaming, and JSON-RPC over WebSocket. One framework-agnostic core engine behind all of them.
    - mark: ⌘
      title: Build a photo editor
      body: A running server and the isomorphic JS client also cover an in-browser editor, not just a CDN.
    - mark: ∞
      title: Any file size
      body: The gRPC host streams chunks straight into Sharp without buffering the whole file, so multi-gigabyte images process without running out of memory.
    - mark: ▤
      title: Drop-in plugin
      body: Ship the transform route into any Fastify app with one register() call, or write a thin adapter for Hono, Elysia or Express.
  cta_title: Start here
  cta_body: >-
    Install the workspace, run a server, and call it from curl or the JS client.
  cta_get_started: Get started
  cta_build_editor: Building an editor

playground_page:
  meta_description: Build a Sharptown transform chain and run it against your server, right in the browser.
  tag: Interactive
  title: Transform Playground
  lead: >-
    Compose operations, watch the request URL and client code build themselves, then run it
    against a live Sharptown server. This page is fully static — the transform runs in your
    browser against the server you point it at.

