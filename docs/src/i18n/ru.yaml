home:
  meta_description: Sharptown — сервис трансформации изображений на своём сервере, на базе Fastify и Sharp.
  tag: Движок трансформации изображений
  title_before: 'Трансформация изображений '
  title_highlight: на своём сервере
  title_after: .
  lead_html: >-
    Изменяйте размер, конвертируйте и оптимизируйте изображения через REST, gRPC или
    JSON-RPC. Ядро на <code>Sharp</code>, не зависящее от фреймворка, плагин Fastify и
    изоморфный JS-клиент — запускайте у себя, перед собственной доставкой изображений.
  cta_docs: Открыть документацию →
  cta_playground: Открыть песочницу
  band:
    - { strong: 'WebP · AVIF · PNG · JPEG · GIF · HEIF', label: форматы вывода }
    - { strong: '0 байт в буфере', label: gRPC-стриминг }
    - { strong: 'Браузер · Node · Bun · Deno', label: изоморфный клиент }
    - { strong: '1 register()', label: плагин Fastify }
  features_heading: Возможности
  features:
    - mark: ⤓
      title: Оптимизация доставки
      body: Конвертируйте загруженные изображения в WebP, AVIF, PNG, JPEG, GIF или HEIF при отдаче. Меньший размер файлов снижает трафик и время загрузки страниц.
    - mark: ⟳
      title: Трансформации по запросу
      body: Изменение размера, поворот, отражение, размытие, оттенки серого, тонирование и управление альфа-каналом — всё в одном запросе на базе libvips через Sharp.
    - mark: ◫
      title: Три транспорта
      body: REST, двунаправленный стриминг gRPC и JSON-RPC поверх WebSocket. За всеми тремя — единый движок, не зависящий от фреймворка.
    - mark: ⌘
      title: Постройте фоторедактор
      body: Запущенного сервера и изоморфного JS-клиента достаточно и для браузерного редактора, а не только для CDN.
    - mark: ∞
      title: Файлы любого размера
      body: gRPC-хост передаёт чанки напрямую в Sharp, не буферизируя файл целиком, поэтому многогигабайтные изображения обрабатываются без переполнения памяти.
    - mark: ▤
      title: Готовый плагин
      body: Добавьте маршрут трансформации в любое приложение Fastify одним вызовом register() или напишите тонкий адаптер для Hono, Elysia или Express.
  cta_title: С чего начать
  cta_body: >-
    Установите рабочее пространство, запустите сервер и вызовите его из curl или JS-клиента.
  cta_get_started: Начать
  cta_build_editor: Как построить редактор

playground_page:
  meta_description: Соберите цепочку трансформаций Sharptown и выполните её на своём сервере прямо в браузере.
  tag: Интерактивно
  title: Песочница трансформаций
  lead: >-
    Соберите операции, наблюдайте, как сами собой формируются URL запроса и код клиента,
    затем выполните запрос на живом сервере Sharptown. Эта страница полностью статична —
    трансформация выполняется в вашем браузере на указанном вами сервере.

